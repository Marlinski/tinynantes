server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # liveness / readiness probe and uptime monitoring
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # manifests, headings, places, version: always revalidate (they change on every publish)
    location ~* \.json$ {
        add_header Cache-Control "no-cache";
    }

    # tile pyramids: big and rarely change
    location /data/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
